# Fork-only workflow: Composer checks, code style, PHPStan and PHPUnit, the same as `make ci` locally.
# Runs on GitHub-hosted runners with Docker; uses no secrets. Upstream's build-latest.yaml and release.yaml publish
# to Docker Hub with upstream's credentials and are disabled in this fork (the files stay unchanged).
name: Fork tests

on:
  push:
    branches: [main, 'wp/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dev image
        run: make build

      - name: Install dependencies from the lock file
        run: make composer c="install --no-progress --prefer-dist --no-interaction"

      - name: Checks (tools/ci.sh)
        run: make ci
